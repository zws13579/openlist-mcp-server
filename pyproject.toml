[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openlist-mcp-server"
version = "1.2.0"
description = "High-performance, zero-dependency MCP server for OpenList / AList cloud storage management."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "OpenList MCP Contributors" }
]
keywords = ["mcp", "openlist", "alist", "cloud-storage", "agent", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
openlist-mcp-server = "server:main"

[project.urls]
Homepage = "https://github.com/zws13579/openlist-mcp-server"
Documentation = "https://doc.oplist.org"
Repository = "https://github.com/zws13579/openlist-mcp-server.git"
Issues = "https://github.com/zws13579/openlist-mcp-server/issues"
